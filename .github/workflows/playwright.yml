name: Playwright

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Electron binary
        run: node scripts/install-electron-binary.js

      - name: 'Performance: Build production bundle'
        run: bun scripts/build-rsbuild.js

      - name: 'Playwright: e2e'
        run: |
          set +e
          set -o pipefail
          bunx playwright test --project=e2e 2>&1 | tee playwright-e2e.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            excerpt="$(tail -n 15 playwright-e2e.log | tr '\r\n' '  ' | cut -c1-1200)"
            echo "::error file=tests/e2e/user-workflows.test.ts::${excerpt}"
            exit "$status"
          fi

      - name: 'Playwright: integration'
        run: |
          set +e
          set -o pipefail
          bunx playwright test --project=integration 2>&1 | tee playwright-integration.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            excerpt="$(tail -n 15 playwright-integration.log | tr '\r\n' '  ' | cut -c1-1200)"
            echo "::error file=tests/integration/app-launch.test.ts::${excerpt}"
            exit "$status"
          fi

      - name: 'Playwright: performance'
        run: |
          set +e
          set -o pipefail
          bunx playwright test --project=performance 2>&1 | tee playwright-performance.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            excerpt="$(tail -n 15 playwright-performance.log | tr '\r\n' '  ' | cut -c1-1200)"
            echo "::error file=tests/performance/performance-regression.test.ts::${excerpt}"
            exit "$status"
          fi

      - name: 'Playwright: preload-artifact'
        run: bunx playwright test --project=preload-artifact

      - name: 'Playwright: Upload failure artifacts'
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: 'Playwright: Upload logs artifact'
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-logs
          path: |
            playwright-e2e.log
            playwright-integration.log
            playwright-performance.log
          if-no-files-found: ignore
          retention-days: 14
