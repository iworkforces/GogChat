name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare-release:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      should_release: ${{ steps.release.outputs.should_release }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      package_version: ${{ steps.release.outputs.package_version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine release eligibility
        id: release
        run: |
          node scripts/release-eligibility.js \
            --ref "${GITHUB_REF}" \
            --ref-name "${GITHUB_REF_NAME}" \
            --source-sha "${GITHUB_SHA}" \
            --remote origin

  qualify-release:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    permissions:
      contents: read
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'

      - run: bun install --frozen-lockfile

      - name: Install Electron binary
        run: node scripts/install-electron-binary.js

      - name: Typecheck
        run: node ./node_modules/@typescript/native/bin/tsc -b

      - name: Documentation claim audit
        run: bun scripts/check-doc-claims.js

      - name: Lint
        run: bash ./scripts/lint.sh

      - name: Test with coverage
        run: node --require ./tests/polyfill-crypto.cjs ./node_modules/vitest/vitest.mjs run --coverage

      - name: 'Architecture: Circular deps'
        run: bunx madge --circular --extensions ts src/

      - name: 'Performance: Build production bundle'
        run: bun scripts/build-rsbuild.js

      - name: 'Playwright: e2e'
        run: bunx playwright test --project=e2e

      - name: 'Playwright: integration'
        run: bunx playwright test --project=integration

      - name: 'Playwright: performance'
        run: bunx playwright test --project=performance

      - name: 'Playwright: preload-artifact'
        run: bunx playwright test --project=preload-artifact

      - name: 'Performance: Headless startup capture'
        run: node scripts/headless-startup.js
        env:
          HEADLESS_TIMEOUT_MS: '90000'
          GOGCHAT_AUTO_QUIT_AFTER_MS: '45000'
          GOGCHAT_PERF_RUNS: '5'
          GOGCHAT_EXPORT_METRICS: '1'

      - name: 'Performance: Budget gate'
        run: node scripts/check-perf-budget.js performance-metrics.json

  build-mac:
    needs: [prepare-release, qualify-release]
    if: needs.prepare-release.outputs.should_release == 'true'
    permissions:
      contents: read
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
          - arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'

      - run: bun install --frozen-lockfile

      - name: Determine macOS signing configuration
        id: mac-signing
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [[ -n "${MAC_CSC_LINK}" && -n "${MAC_CSC_KEY_PASSWORD}" ]]; then
            echo "signing_configured=true" >> "${GITHUB_OUTPUT}"
          elif [[ -z "${MAC_CSC_LINK}" && -z "${MAC_CSC_KEY_PASSWORD}" ]]; then
            echo "signing_configured=false" >> "${GITHUB_OUTPUT}"
          else
            echo "macOS signing credentials must be configured as a complete pair or both omitted." >&2
            exit 1
          fi

      - name: Build macOS ${{ matrix.arch }} DMG
        run: bun run package:mac:${{ matrix.arch }}
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

      - name: Verify macOS artifact trust
        if: steps.mac-signing.outputs.signing_configured == 'true'
        run: bun scripts/verify-mac-release-signing.js --dist dist

      - name: Verify macOS ${{ matrix.arch }} artifact
        run: bun scripts/verify-macos-package-artifacts.js --dist dist --manifest --require-arch ${{ matrix.arch }} --source-sha ${{ needs.prepare-release.outputs.source_sha }} --package-version "${{ needs.prepare-release.outputs.package_version }}"

      - name: Upload macOS ${{ matrix.arch }} DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            dist/*-${{ matrix.arch }}.dmg
            dist/*-${{ matrix.arch }}.dmg.json
          if-no-files-found: error

  build-windows:
    needs: [prepare-release, qualify-release]
    if: needs.prepare-release.outputs.should_release == 'true'
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            processor_architecture: AMD64
          - arch: arm64
            runner: windows-11-arm
            processor_architecture: ARM64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'

      - run: bun install --frozen-lockfile

      - name: Verify Windows signing policy
        run: bun run package:win:signing-policy
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WINDOWS_ALLOW_UNSIGNED_RELEASE: ${{ vars.WINDOWS_ALLOW_UNSIGNED_RELEASE }}

      - name: Verify Windows runner architecture
        shell: pwsh
        run: |
          $actualArchitecture = $env:PROCESSOR_ARCHITECTURE
          $expectedArchitecture = '${{ matrix.processor_architecture }}'
          if ($actualArchitecture -ne $expectedArchitecture) {
            Write-Error "Expected Windows runner architecture $expectedArchitecture for ${{ matrix.arch }}, got $actualArchitecture"
            exit 1
          }
          Write-Host "Windows runner architecture matches $expectedArchitecture for ${{ matrix.arch }}"

      - name: Build Windows ${{ matrix.arch }} setup
        run: bun run package:win:${{ matrix.arch }}
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Verify Windows Authenticode signature
        if: vars.WINDOWS_ALLOW_UNSIGNED_RELEASE != 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "*windows-${{ matrix.arch }}-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No Windows ${{ matrix.arch }} setup installer found for signature verification"
            exit 1
          }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne 'Valid') {
            Write-Error "Windows ${{ matrix.arch }} installer signature is $($signature.Status): $($signature.StatusMessage)"
            exit 1
          }
          Write-Host "Windows ${{ matrix.arch }} installer Authenticode signature is valid"

      - name: Verify Windows ${{ matrix.arch }} artifact
        run: bun scripts/verify-windows-package-artifacts.js --dist dist --manifest --require-arch ${{ matrix.arch }} --source-sha ${{ needs.prepare-release.outputs.source_sha }} --package-version "${{ needs.prepare-release.outputs.package_version }}"

      - name: Upload Windows ${{ matrix.arch }} artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-${{ matrix.arch }}
          path: |
            dist/*windows-${{ matrix.arch }}-setup.exe
            dist/*windows-${{ matrix.arch }}-setup.exe.json
          if-no-files-found: error

  verify-release-artifacts:
    needs: [prepare-release, build-mac, build-windows]
    if: needs.prepare-release.outputs.should_release == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'

      - run: bun install --frozen-lockfile

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Verify Windows signing policy before publish
        run: bun run package:win:signing-policy
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WINDOWS_ALLOW_UNSIGNED_RELEASE: ${{ vars.WINDOWS_ALLOW_UNSIGNED_RELEASE }}

      - name: Verify aggregated release artifacts
        run: bun scripts/verify-release-artifacts.js --input release-artifacts --output verified-release-assets --source-sha ${{ needs.prepare-release.outputs.source_sha }} --package-version "${{ needs.prepare-release.outputs.package_version }}"

      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-assets
          path: verified-release-assets/*
          if-no-files-found: error

  create-release-tag:
    needs: [prepare-release, verify-release-artifacts]
    if: needs.prepare-release.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    concurrency:
      group: create-release-tag-${{ needs.prepare-release.outputs.tag_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}
          fetch-depth: 0

      - name: Create or retry release tag at exact source SHA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/release-tag.js \
            --tag "${{ needs.prepare-release.outputs.tag_name }}" \
            --source-sha "${{ needs.prepare-release.outputs.source_sha }}" \
            --remote origin

  publish-release:
    needs: [prepare-release, verify-release-artifacts, create-release-tag]
    if: needs.prepare-release.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-assets
          path: verified-release-assets

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: verified-release-assets/*
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          fail_on_unmatched_files: true
          make_latest: true
