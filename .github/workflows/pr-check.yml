name: PR Check

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & Test
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Electron binary
        run: node scripts/install-electron-binary.js

      - name: Typecheck
        run: node ./node_modules/@typescript/native/bin/tsc -b

      - name: Documentation claim audit
        run: bun scripts/check-doc-claims.js

      - name: Lint
        run: bash ./scripts/lint.sh

      - name: Test with coverage
        run: node --require ./tests/polyfill-crypto.cjs ./node_modules/vitest/vitest.mjs run --coverage 2>&1 | tee coverage-output.txt

      - name: 'Architecture: Circular deps'
        run: bunx madge --circular --extensions ts src/

      - name: 'Performance: Build production bundle'
        run: bun scripts/build-rsbuild.js

      - name: 'Performance: Headless startup capture'
        run: node scripts/headless-startup.js
        env:
          # Per-run overall harness timeout (includes Electron boot + document load).
          HEADLESS_TIMEOUT_MS: '90000'
          # Capture timeout floor is also enforced in the finalizer when
          # GOGCHAT_EXPORT_METRICS=1; keep this high enough for cold CI loads.
          GOGCHAT_AUTO_QUIT_AFTER_MS: '45000'
          GOGCHAT_PERF_RUNS: '5'
          GOGCHAT_EXPORT_METRICS: '1'

      - name: 'Performance: Budget gate'
        run: node scripts/check-perf-budget.js performance-metrics.json

      - name: 'Performance: Upload metrics artifact'
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-metrics
          path: |
            performance-metrics.json
            .perf-history.json
            coverage-output.txt
          if-no-files-found: ignore
          retention-days: 14
