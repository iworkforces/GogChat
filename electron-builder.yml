# Electron Builder Configuration
# https://www.electron.build/configuration/configuration

appId: com.ocworkforces.gogchat
productName: GogChat
copyright: Copyright © 2026 iworkforces

# Protocol handler for deep linking
protocols:
  name: 'GogChat'
  schemes:
    - gogchat
    - https

# Directories
directories:
  output: dist
  buildResources: resources

# Files to include/exclude in the app
files:
  - lib/**/*
  - node_modules/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.test.{ts,js}'
  - '!**/*.spec.{ts,js}'
  - '!src/**/*'
  - '!.github/**/*'
  - '!coverage/**/*'
  - '!debian/**/*'
  - '!mac/**/*'
  - '!windows/**/*'
  - '!.git/**/*'
  - '!.vscode/**/*'
  - '!.idea/**/*'
  - '!tests/**/*'
  - '!scripts/**/*'
  - '!**/*.md'
  - '!tsconfig.json'
  - '!vitest.config.ts'
  - '!playwright.config.ts'
  - '!eslint.config.js'
  - '!.prettierrc.json'
  - '!.editorconfig'
  - '!.npmrc'
  - '!.gitignore'
  - '!.gitattributes'
  - '!.DS_Store'
  - '!package-lock.json'
  - '!bun.lock'
  - '!bunfig.toml'
  - '!bun.lock'
  - '!bunfig.toml'
  - '!entitlements.mac.*.plist'
  - '!electron-builder*.yml'
  - '!rsbuild.config.ts'
  - '!build-macOS-*.sh'
  # Proven build-only toolchain packages (see verify-packaged-dependency-closure).
  # Moved out of runtime dependencies; belt-and-suspenders exclusion if hoisted.
  - '!node_modules/@rslib/**/*'
  - '!node_modules/@rspack/**/*'
  - '!node_modules/@ast-grep/**/*'

# Compression settings
compression: maximum
asar: true

# Runtime resources (icons, tray images) — placed outside asar in Contents/Resources/
# Accessible via process.resourcesPath in packaged app
extraResources:
  - from: resources
    to: resources
    filter:
      - '**/*'

# Locale optimization - keep only English (backup to after-pack.cjs)
electronLanguages:
  - en-US
  - en
afterPack: scripts/after-pack.cjs
afterSign: scripts/notarize.cjs

# macOS Configuration
# Supported packaging arches: arm64 (Apple Silicon) and x64 (Intel).
# Do not list both under target.arch — electron-builder then builds every listed
# arch even when the CLI passes a single --arm64/--x64 pin. CI and package
# scripts always pass exactly one arch flag.
mac:
  category: public.app-category.social-networking
  icon: resources/icons/normal/mac.icns
  minimumSystemVersion: '11.0'
  target:
    - target: dmg
  gatekeeperAssess: false
  extendInfo:
    NSCameraUsageDescription: 'GogChat needs camera access for Google Meet and Huddle video calls.'
    NSMicrophoneUsageDescription: 'GogChat needs microphone access for Google Meet and Huddle calls.'

win:
  icon: resources/icons/normal/win.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64

nsis:
  buildUniversalInstaller: false
  artifactName: '${productName}-${version}-windows-${arch}-setup.${ext}'

# DMG Configuration
dmg:
  title: '${productName} ${version}'
  icon: resources/icons/normal/mac.icns
  iconSize: 100
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications
  # Optional: Custom background
  # background: resources/dmg-background.png
  format: ULFO
  shrink: true

# Auto-update: configure a real provider here when ready.
# Example: provider: github (uses GitHub Releases)
publish:
  provider: github
  owner: iworkforces
  repo: GogChat

# Additional metadata
artifactName: '${productName}-${version}-${arch}.${ext}'
